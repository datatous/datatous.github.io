<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI에게 넘기지 않을 것들 — 움직이는 카드뉴스</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{height:100%;background:#0d0d0d;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;overflow:hidden;}
  .wrap{position:relative;width:100%;height:100%;}
  .deck{display:flex;width:100%;height:100%;overflow-x:auto;overflow-y:hidden;scroll-snap-type:x mandatory;scroll-behavior:smooth;-webkit-overflow-scrolling:touch;scrollbar-width:none;}
  .deck::-webkit-scrollbar{display:none;}
  .card{flex:0 0 100%;width:100%;height:100%;scroll-snap-align:center;position:relative;background:#0d0d0d;}
  .card img,.card video{width:100%;height:100%;display:block;object-fit:cover;}
  .nav-btn{position:absolute;top:50%;transform:translateY(-50%);z-index:10;width:36px;height:36px;border-radius:999px;border:1px solid rgba(255,255,255,.22);background:rgba(13,13,13,.58);color:#fff;font-size:20px;line-height:1;display:flex;align-items:center;justify-content:center;cursor:pointer;backdrop-filter:blur(6px);transition:opacity .2s,background .2s;}
  .nav-btn:hover{background:rgba(13,13,13,.85);}
  .nav-btn[disabled]{opacity:.22;cursor:default;}
  .nav-prev{left:10px;}
  .nav-next{right:10px;}
  .counter{position:absolute;top:12px;right:12px;z-index:10;padding:4px 10px;border-radius:999px;background:rgba(13,13,13,.62);border:1px solid rgba(255,255,255,.16);font-size:12px;font-weight:600;letter-spacing:.04em;backdrop-filter:blur(6px);}
</style>
</head>
<body>
<div class="wrap">
  <div class="counter" id="counter">1 / 6</div>
  <button class="nav-btn nav-prev" id="prev" type="button" aria-label="이전 카드" disabled>‹</button>
  <button class="nav-btn nav-next" id="next" type="button" aria-label="다음 카드">›</button>
  <div class="deck" id="deck">
    <div class="card">
      <video src="/assets/images/cards/what-we-keep/01.mp4" poster="/assets/images/cards/what-we-keep/01.png" autoplay loop muted playsinline preload="metadata" aria-label="01. 이것도 자동화되나요? — 한동안, 내 질문은 이것뿐이었다."></video>
    </div>
    <div class="card">
      <img src="/assets/images/cards/what-we-keep/02.png" alt="02. 개발도, 주보도, 블로그도. — 일단 맡겨 봤다." loading="lazy">
    </div>
    <div class="card">
      <img src="/assets/images/cards/what-we-keep/03.png" alt="03. 그런데, 무엇을 할지는 누가 정하지?" loading="lazy">
    </div>
    <div class="card">
      <img src="/assets/images/cards/what-we-keep/04.png" alt="04. 잘하는 일은, 계속 맡길 생각이다." loading="lazy">
    </div>
    <div class="card">
      <video src="/assets/images/cards/what-we-keep/05.mp4" poster="/assets/images/cards/what-we-keep/05.png" autoplay loop muted playsinline preload="metadata" aria-label="05. 이건 내가 잘하고 싶어졌다."></video>
    </div>
    <div class="card">
      <img src="/assets/images/cards/what-we-keep/06.png" alt="06. 다 맡길 수 있어도, 이건 내가 한다." loading="lazy">
    </div>
  </div>
</div>
<script>
  (function () {
    var deck = document.getElementById('deck');
    var prev = document.getElementById('prev');
    var next = document.getElementById('next');
    var counter = document.getElementById('counter');
    var total = 6;
    function currentIdx() {
      var w = deck.clientWidth || 1;
      return Math.max(0, Math.min(total - 1, Math.round(deck.scrollLeft / w)));
    }
    function update() {
      var idx = currentIdx();
      counter.textContent = (idx + 1) + ' / ' + total;
      prev.disabled = idx <= 0;
      next.disabled = idx >= total - 1;
    }
    function go(delta) {
      var idx = Math.max(0, Math.min(total - 1, currentIdx() + delta));
      deck.scrollTo({ left: idx * deck.clientWidth, behavior: 'smooth' });
    }
    prev.addEventListener('click', function () { go(-1); });
    next.addEventListener('click', function () { go(1); });
    deck.addEventListener('scroll', update, { passive: true });
    window.addEventListener('resize', update);
    update();
  })();
</script>
</body>
</html>
