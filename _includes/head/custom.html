<!-- 로고 워드마크 (마스트헤드) -->

  .site-title{display:inline-flex!important;align-items:center;}
  .brand-wm{font-family:'Sora',sans-serif;font-weight:700;letter-spacing:-.02em;
    font-size:1.2rem;line-height:1;white-space:nowrap;}
  .brand-wm .a{color:#0b1220;} .brand-wm .b{color:#2563eb;}
</style>

<!-- 읽기 진행 바 + 형광펜 -->
<style>
  #read-progress{position:fixed;top:0;left:0;height:3px;width:0;z-index:1000;
    background:linear-gradient(90deg,#2563eb,#60a5fa);transition:width .08s linear;}
  mark{background:linear-gradient(180deg,transparent 55%,#bfdbfe 55%);
    color:inherit;padding:0 .06em;border-radius:2px;}
</style>
<script>
  document.addEventListener('DOMContentLoaded',function(){
    var bar=document.createElement('div');bar.id='read-progress';document.body.appendChild(bar);
    function upd(){var h=document.documentElement;var max=h.scrollHeight-h.clientHeight;
      var p=max>0?(window.scrollY||h.scrollTop)/max*100:0;bar.style.width=p+'%';}
    window.addEventListener('scroll',upd,{passive:true});
    window.addEventListener('resize',upd);upd();
  });
</script>

<!-- 관리자 인라인 편집 모드 (로컬에서만 활성 · Ctrl+Shift+E) -->

<!-- Mermaid 다이어그램 — ```mermaid 펜스를 그림으로 (위키·포스트 공용, 2026-09-23)
     kramdown+rouge는 펜스를 div.language-mermaid > pre > code 로 내보낸다. 그 블록이
     있는 페이지에서만 라이브러리를 불러온다 — 없는 페이지는 비용 0. -->
<style>
  pre.mermaid{background:transparent!important;border:0!important;box-shadow:none!important;
    text-align:center;margin:1.4em 0;padding:0;overflow-x:auto;}
  pre.mermaid svg{max-width:100%;height:auto;}
  .wiki-sources{margin-top:2.6rem;padding-top:.8rem;border-top:1px solid #e2e8f0;
    font-size:.78rem;line-height:1.7;color:#64748b;}
  .wiki-sources b{color:#475569;margin-right:.3em;}
  .wiki-sources code{font-size:.72rem;background:#f1f5f9;color:#475569;}
</style>
<script type="module">
  const codes = document.querySelectorAll('code.language-mermaid, div.language-mermaid code');
  if (codes.length) {
    const seen = new Set();
    codes.forEach((c) => {
      const box = c.closest('div.language-mermaid') || c.closest('pre') || c;
      if (seen.has(box)) return;
      seen.add(box);
      const pre = document.createElement('pre');
      pre.className = 'mermaid';
      pre.textContent = c.textContent;
      box.replaceWith(pre);
    });
    const { default: mermaid } = await import('https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.esm.min.mjs');
    mermaid.initialize({
      startOnLoad: false,
      theme: 'base',
      flowchart: { curve: 'basis', htmlLabels: true },
      themeVariables: {
        fontFamily: '"Pretendard Variable", Pretendard, sans-serif',
        fontSize: '15px',
        primaryColor: '#eff6ff', primaryBorderColor: '#2563eb', primaryTextColor: '#0f172a',
        secondaryColor: '#f1f5f9', tertiaryColor: '#ffffff',
        lineColor: '#64748b', clusterBkg: '#f8fafc', clusterBorder: '#cbd5e1',
        edgeLabelBackground: '#ffffff'
      }
    });
    await mermaid.run({ querySelector: 'pre.mermaid' });
  }
</script>
